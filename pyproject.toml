[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turkce-tts-sinav"
version = "0.1.0"
description = "Türkçe G2P, sözcük vurgusu ve ses sentezi ön uçları için açık sınav verisi ve değerlendirici"
readme = "README.md"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/seslen-tr/turkce-tts-sinav"
Source = "https://github.com/seslen-tr/turkce-tts-sinav"
Issues = "https://github.com/seslen-tr/turkce-tts-sinav/issues"

[tool.setuptools.packages.find]
include = ["turkce_tts_sinav*"]

[tool.setuptools.package-data]
turkce_tts_sinav = ["veri/*.tsv"]
